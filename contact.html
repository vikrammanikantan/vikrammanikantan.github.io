<!DOCTYPE html>
<html lang="en-US">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Vikram Manikantan</title>
        <link rel="icon" type="image/x-icon" href="images/pixel.png">
        <link rel="stylesheet" href="assets/css/main.css" />

    </head>

    <body id="top">

        <div id="navbar-container"></div>

        <script>
        fetch("partials/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar-container").innerHTML = html);
        </script>

        <div class="grid-container" style="min-height: 92vh;">
            <div class="section" id="contact" style="align-content: flex-start;">
                <h1>Contact</h1>

                <div class="contact-list">
                    <div class="contact-row">
                        <span class="contact-label">Email</span>
                        <span class="contact-value">
                            <a href="mailto:vik@arizona.edu">vik@arizona.edu</a>
                        </span>
                    </div>
                    <div class="contact-row">
                        <span class="contact-label">GitHub</span>
                        <span class="contact-value">
                            <a href="https://github.com/vikrammanikantan" target="_blank">vikrammanikantan</a>
                        </span>
                    </div>
                    <div class="contact-row">
                        <span class="contact-label">Publications</span>
                        <span class="contact-value">
                            <a href="https://scholar.google.com/citations?user=cscvnHUAAAAJ&hl=en" target="_blank">Google Scholar</a> &nbsp;·&nbsp;
                            <a href="https://scixplorer.org/search?d=astrophysics&p=1&q=author%3A%22Manikantan%2C+Vikram%22&sort=score+desc&sort=date+desc" target="_blank">SciX</a>
                        </span>
                    </div>
                    <div class="contact-row">
                        <span class="contact-label">ORCID</span>
                        <span class="contact-value">
                            <a href="https://orcid.org/0000-0003-0547-6158" target="_blank">0000-0003-0547-6158</a>
                        </span>
                    </div>
                    <div class="contact-row">
                        <span class="contact-label">Department Profile</span>
                        <span class="contact-value">
                            <a href="https://astro.arizona.edu/person/vikram-manikantan" target="_blank">Steward Observatory</a>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>

        <script>
        fetch("partials/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer-container").innerHTML = html);
        </script>

        <script src="assets/js/main.js"></script>
    </body>

</html>
